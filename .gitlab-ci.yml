stages:
  - build

default:
  image: docker:latest
  services:
    - docker:dind

variables:
  IMAGE_NAME: '$ACR_LOGIN_SERVER/driverflyfrontend:$CI_COMMIT_SHA'
  IMAGE_LATEST: '$ACR_LOGIN_SERVER/driverflyfrontend:latest'
  # Dedicated tag that stores the cacheable "builder" stage (incl. the slow
  # `npm ci` layer) so it can be reused across pipelines.
  IMAGE_BUILDER: '$ACR_LOGIN_SERVER/driverflyfrontend:builder'
  # Required so docker-in-docker works without TLS certs
  DOCKER_TLS_CERTDIR: ''
  # Enable BuildKit so --cache-from / inline cache works with docker build.
  DOCKER_BUILDKIT: '1'

build:
  stage: build
  # Let GitLab auto-cancel this run when a newer pipeline supersedes it.
  interruptible: true
  # Safety net for the first cache-populating run; cached runs finish well under this.
  timeout: 2h
  script:
    - echo "Building Docker image..."
    - docker login $ACR_LOGIN_SERVER -u $ACR_USERNAME -p $ACR_PASSWORD
    - |
      echo "Validating required env vars..."
      # Disable errexit during validation to avoid accidental failures
      set +e
      required="NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_FRONTEND_BASE_URL NEXT_PUBLIC_BASE_URL_API"
      for v in $required; do
        eval val="\${$v}"
        if [ -z "$val" ]; then
          echo "ERROR: Missing required CI variable: $v";
        else
          echo "OK: $v present"
        fi
      done
      optional="NEXT_PUBLIC_RECAPTCHA_SITE_KEY RECAPTCHA_SECRET_KEY NEXT_PUBLIC_MICROSOFT_CLARITY NEXT_PUBLIC_MAPBOX_API_KEY NEXT_PUBLIC_TWILIO_APP_NAME NEXT_PUBLIC_PHONE_INPUT_COUNTRY_ALLOWED NEXT_PUBLIC_GOOGLE_ANALYTICS"
      for v in $optional; do
        eval val="\${$v}"
        if [ -z "$val" ]; then
          echo "WARN: Optional CI variable not set: $v"
        fi
      done
      echo "Using BASE_URL_API=$BASE_URL_API"
      echo ""
      echo "Env snapshot (non-sensitive values):"
      echo "BASE_URL=$BASE_URL"
      echo "FRONTEND_BASE_URL=$FRONTEND_BASE_URL"
      echo "BASE_URL_API=$BASE_URL_API"
      echo "NEXT_PUBLIC_BASE_URL_API=$BASE_URL_API"
      echo "NEXT_PUBLIC_BASE_URL=$BASE_URL"
      echo "NEXT_PUBLIC_FRONTEND_BASE_URL=$NEXT_PUBLIC_FRONTEND_BASE_URL"
      echo "NEXT_PUBLIC_MICROSOFT_CLARITY=$NEXT_PUBLIC_MICROSOFT_CLARITY"
      echo "NEXT_PUBLIC_GOOGLE_ANALYTICS=$NEXT_PUBLIC_GOOGLE_ANALYTICS"
      echo "RECAPTCHA_SITE_KEY=$NEXT_PUBLIC_RECAPTCHA_SITE_KEY"
      echo "NEXT_PUBLIC_RECAPTCHA_SITE_KEY=$NEXT_PUBLIC_RECAPTCHA_SITE_KEY"
      echo "PHONE_INPUT_COUNTRY_ALLOWED=$NEXT_PUBLIC_PHONE_INPUT_COUNTRY_ALLOWED"
      echo "NEXT_PUBLIC_PHONE_INPUT_COUNTRY_ALLOWED=$NEXT_PUBLIC_PHONE_INPUT_COUNTRY_ALLOWED"
      echo "MAPBOX_API_KEY=$NEXT_PUBLIC_MAPBOX_API_KEY"
      echo "NEXT_PUBLIC_MAPBOX_API_KEY=$NEXT_PUBLIC_MAPBOX_API_KEY"
      echo "TWILIO_APP_NAME=$NEXT_PUBLIC_TWILIO_APP_NAME"
      echo "NEXT_PUBLIC_TWILIO_APP_NAME=$NEXT_PUBLIC_TWILIO_APP_NAME"
      for v in RECAPTCHA_SECRET_KEY; do
        eval val="\${$v}"
        if [ -n "$val" ]; then
          echo "$v is set"
        else
          echo "$v is not set"
        fi
      done
      # Re-enable errexit for subsequent commands
      set -e
    - |
      # Best-effort: warm the local cache from previously pushed images so the
      # expensive `npm ci` builder layer can be reused instead of rebuilt.
      echo "Pulling cache images (best-effort)..."
      docker pull "$IMAGE_BUILDER" || echo "No builder cache yet (first cached run)."
      docker pull "$IMAGE_LATEST" || echo "No latest image yet."
    - |
      # Common build args (shared by both build passes). NEXT_PUBLIC_* values are
      # inlined by `next build` in the builder stage.
      set -- \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --build-arg GIT_COMMIT="$CI_COMMIT_SHA" \
        --build-arg BASE_URL="$BASE_URL" \
        --build-arg FRONTEND_BASE_URL="$NEXT_PUBLIC_FRONTEND_BASE_URL" \
        --build-arg BASE_URL_API="$BASE_URL_API" \
        --build-arg NEXT_PUBLIC_BASE_URL_API="$BASE_URL_API" \
        --build-arg NEXT_PUBLIC_FRONTEND_BASE_URL="$NEXT_PUBLIC_FRONTEND_BASE_URL" \
        --build-arg MAPBOX_API_KEY="$NEXT_PUBLIC_MAPBOX_API_KEY" \
        --build-arg NEXT_PUBLIC_MAPBOX_API_KEY="$NEXT_PUBLIC_MAPBOX_API_KEY" \
        --build-arg NEXT_PUBLIC_MICROSOFT_CLARITY="$NEXT_PUBLIC_MICROSOFT_CLARITY" \
        --build-arg RECAPTCHA_SITE_KEY="$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" \
        --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY="$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" \
        --build-arg RECAPTCHA_SECRET_KEY="$RECAPTCHA_SECRET_KEY" \
        --build-arg TWILIO_APP_NAME="$NEXT_PUBLIC_TWILIO_APP_NAME" \
        --build-arg NEXT_PUBLIC_TWILIO_APP_NAME="$NEXT_PUBLIC_TWILIO_APP_NAME" \
        --build-arg PHONE_INPUT_COUNTRY_ALLOWED="$NEXT_PUBLIC_PHONE_INPUT_COUNTRY_ALLOWED" \
        --build-arg NEXT_PUBLIC_PHONE_INPUT_COUNTRY_ALLOWED="$NEXT_PUBLIC_PHONE_INPUT_COUNTRY_ALLOWED" \
        --build-arg NEXT_PUBLIC_GOOGLE_ANALYTICS="$NEXT_PUBLIC_GOOGLE_ANALYTICS"

      echo "Building cacheable 'builder' stage..."
      docker build \
        --target builder \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "$IMAGE_BUILDER" \
        "$@" \
        -t "$IMAGE_BUILDER" .
      # Push the builder cache as early as possible so future pipelines benefit
      # even if a later step fails.
      docker push "$IMAGE_BUILDER" || echo "WARN: failed to push builder cache (non-fatal)."

      echo "Building final image (reusing builder + latest cache)..."
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "$IMAGE_BUILDER" \
        --cache-from "$IMAGE_LATEST" \
        "$@" \
        -t "$IMAGE_NAME" .
    - echo "Verifying build contains latest code..."
    - docker run --rm $IMAGE_NAME sh -c "echo Build completed successfully"
    - docker push $IMAGE_NAME
    - docker tag $IMAGE_NAME $IMAGE_LATEST
    - docker push $IMAGE_LATEST
  only:
    - main
